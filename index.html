<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>sage history — 청사의 방</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@400;600;900&family=Gowun+Batang&display=swap" rel="stylesheet">
<style>
:root{--night:#151A26;--night2:#1B2233;--paper:#EEE8DA;--dim:#B9B2A0;--seal:#C4472F;--brass:#B9955C;--line:rgba(238,232,218,.14)}
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--night);color:var(--paper);font-family:'Gowun Batang','Noto Serif KR',serif;-webkit-font-smoothing:antialiased}
header{padding:56px 6vw 26px;border-bottom:1px solid var(--line)}
.eyebrow{font-size:12px;letter-spacing:.35em;color:var(--brass);text-transform:uppercase}
h1{font-family:'Noto Serif KR',serif;font-weight:900;font-size:clamp(30px,4.5vw,52px);margin:10px 0 6px}
.sub{color:var(--dim);font-size:15px}
.toolbar{display:flex;flex-wrap:wrap;gap:9px;align-items:center;padding:16px 6vw;border-bottom:1px solid var(--line);position:sticky;top:0;background:rgba(21,26,38,.93);backdrop-filter:blur(8px);z-index:5}
.chip{border:1px solid var(--line);background:none;color:var(--dim);padding:7px 13px;border-radius:999px;font-family:inherit;font-size:13px;cursor:pointer;display:flex;align-items:center;gap:7px;transition:.2s}
.chip .dot{width:8px;height:8px;border-radius:50%}
.chip:hover{border-color:var(--brass);color:var(--paper)}
.chip.on{background:var(--paper);border-color:var(--paper);color:#1B1912;font-weight:700}
#q{margin-left:auto;background:var(--night2);border:1px solid var(--line);color:var(--paper);padding:9px 14px;border-radius:8px;font-family:inherit;font-size:14px;min-width:190px}
#q:focus{outline:2px solid var(--brass);outline-offset:1px}
.count{padding:20px 6vw 0;color:var(--dim);font-size:13px;letter-spacing:.15em}
.tl{position:relative;padding:34px 6vw 90px;max-width:980px}
.tl::before{content:"";position:absolute;left:calc(6vw + 90px);top:0;bottom:0;width:2px;background:linear-gradient(var(--line),var(--brass),var(--line))}
.era{position:relative;margin:38px 0 6px;padding-left:126px;font-family:'Noto Serif KR',serif;font-weight:900;font-size:15px;letter-spacing:.3em;color:var(--brass)}
.era::before{content:"";position:absolute;left:84px;top:50%;width:14px;height:14px;transform:translateY(-50%) rotate(45deg);background:var(--night);border:2px solid var(--brass)}
.ev{position:relative;display:flex;gap:0;margin:16px 0;cursor:pointer;background:none;border:none;text-align:left;color:var(--paper);font-family:inherit;width:100%}
.ev .yr{width:90px;flex:none;text-align:right;padding:16px 18px 0 0;font-family:'Noto Serif KR',serif;font-weight:600;font-size:14px;color:var(--dim)}
.ev .node{position:absolute;left:84.5px;top:22px;width:13px;height:13px;border-radius:50%;background:var(--night);border:3px solid var(--seal)}
.ev .card{margin-left:36px;flex:1;background:var(--night2);border:1px solid var(--line);border-left:4px solid var(--seal);border-radius:6px;padding:15px 18px;transition:transform .2s,border-color .2s}
.ev:hover .card,.ev:focus-visible .card{transform:translateX(5px);border-color:var(--brass)}
.ev:focus-visible{outline:2px solid var(--brass);outline-offset:3px;border-radius:8px}
.card .tk{font-size:11px;letter-spacing:.22em;margin-bottom:5px}
.card .tt{font-family:'Noto Serif KR',serif;font-weight:900;font-size:18px;line-height:1.4;word-break:keep-all}
.card .ol{color:var(--dim);font-size:13.5px;line-height:1.7;margin-top:7px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.card .meta{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px;font-size:11.5px;color:var(--dim)}
.badge{border:1px solid var(--line);border-radius:999px;padding:2px 9px}
.badge.rh{border-color:var(--seal);color:var(--seal)}
dialog{width:min(780px,93vw);max-height:87vh;background:var(--paper);color:#221E15;border:none;border-radius:10px;padding:0}
dialog::backdrop{background:rgba(10,13,20,.74);backdrop-filter:blur(3px)}
.dhead{padding:30px 38px 18px;border-bottom:1px solid rgba(34,30,21,.15);position:sticky;top:0;background:var(--paper)}
.dhead .cat{font-size:12px;letter-spacing:.28em;color:var(--seal)}
.dhead h2{font-family:'Noto Serif KR',serif;font-weight:900;font-size:25px;margin:6px 0 4px;word-break:keep-all}
.dhead .who{color:#6E6553;font-size:14px}
.dbody{padding:24px 38px 44px;overflow-y:auto;font-size:15.5px;line-height:1.85}
.dbody h3{font-family:'Noto Serif KR',serif;margin:24px 0 10px;font-size:19px;border-bottom:1px solid rgba(34,30,21,.15);padding-bottom:6px}
.dbody h4,.dbody h5{margin:16px 0 8px}
.dbody p{margin:10px 0}.dbody ul,.dbody ol{margin:10px 0 10px 22px}.dbody li{margin:7px 0}
.dbody blockquote{border-left:3px solid var(--brass);padding-left:14px;color:#5E5646;margin:12px 0}
.dbody em{color:#7A6433}
.close{position:absolute;top:22px;right:24px;background:none;border:1px solid rgba(34,30,21,.3);border-radius:999px;width:34px;height:34px;font-size:16px;cursor:pointer;font-family:inherit}
.empty{padding:60px 6vw;color:var(--dim)}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
@media (max-width:620px){
 .tl::before{left:calc(6vw + 8px)}
 .ev .yr{position:absolute;left:30px;top:-2px;width:auto;text-align:left;padding:0;font-size:12.5px}
 .ev .node{left:2.5px}
 .ev .card{margin-left:30px;margin-top:20px}
 .era{padding-left:34px}.era::before{left:2px}
 .dhead,.dbody{padding-left:22px;padding-right:22px}
}
</style>
</head>
<body>
<header>
  <div class="eyebrow">Sage History</div>
  <h1>청사(靑史)의 방</h1>
  <div class="sub"><a href="compare.html" style="color:var(--brass);text-decoration:none">▦ 대조 연표로 보기</a> · 잊지 말아야 할 사건 3건 · 카드를 누르면 배경과 인사이트, <span style="color:var(--seal)">↺ 반복의 라임</span>이 열립니다</div>
</header>
<div class="toolbar" id="chips"><input id="q" type="search" placeholder="사건·지역·태그 검색"></div>
<div class="count" id="count"></div>
<div class="tl" id="tl"></div>
<dialog id="dlg"><button class="close" onclick="dlg.close()" aria-label="닫기">✕</button><div class="dhead"><div class="cat" id="dcat"></div><h2 id="dtitle"></h2><div class="who" id="dwho"></div></div><div class="dbody" id="dbody"></div></dialog>
<script>
const EVS=[{"title": "루터의 종교개혁", "ys": 1517, "ye": 1555, "period": "1517–1555", "region": "유럽", "track": "개혁과 반동", "color": "#C4472F", "tags": ["종교개혁", "95개조", "인쇄술", "미디어혁명", "권위의붕괴"], "reliability": "사료기반", "one": "무명의 신학 교수 마르틴 루터가 면벌부 판매를 비판한 95개조 논제가 인쇄술이라는 신기술을 타고 수 주 만에 유럽 전역으로 퍼지며, 천 년 권위를 흔들고 근대의 문을 연 사건 — 콘텐츠와 미디어가 만나면 권력 구조가 바뀐다는 것을 증명한 최초의 대규모 사례.", "rhymes": 3, "html": "<h2>루터의 종교개혁<\/h2>\n<p><strong>한 줄 정의:<\/strong> 무명의 신학 교수 마르틴 루터가 면벌부 판매를 비판한 95개조 논제가 인쇄술이라는 신기술을 타고 수 주 만에 유럽 전역으로 퍼지며, 천 년 권위를 흔들고 근대의 문을 연 사건 — 콘텐츠와 미디어가 만나면 권력 구조가 바뀐다는 것을 증명한 최초의 대규모 사례.<\/p>\n<p><em>(참고: 20세기 미국 민권운동가 마틴 루터 킹 주니어는 이 인물의 이름을 따랐다. 별도 카드(36번)로 다룬다 — 이름이 닮은 두 사람이 각자 시대의 &#x27;개혁&#x27;을 이끈 것도 하나의 라임이다.)<\/em><\/p>\n<h3>배경<\/h3>\n<p>16세기 초 교회는 성 베드로 성당 건축 자금 등을 위해 면벌부(돈을 내면 죄의 벌을 감해준다는 증서) 판매를 확대하고 있었다. 비텐베르크 대학의 신학 교수 루터는 1517년 10월 31일, 이 관행의 신학적 근거를 묻는 95개조 논제를 발표했다⚠️(성당 문에 게시했다는 유명한 장면은 후대 기록에 근거한 것으로, 실제 게시 여부는 사학계에서 논쟁이 있다 — 대학 관행상 게시했을 개연성과 서신 발송만 했다는 설이 공존).<\/p>\n<h3>전개<\/h3>\n<p>라틴어로 쓴 학술 토론 제안이었지만, 곧 독일어로 번역·인쇄되며 통제 불가능하게 확산됐다. 구텐베르크 인쇄술(1450년대) 이후 약 70년 — 기술은 준비돼 있었고 콘텐츠가 도착한 순간이었다. 루터는 파문과 제국 추방령에도 성서 독일어 번역으로 응수했고, 이는 표준 독일어 형성에까지 영향을 미쳤다. 종교 갈등은 정치 질서와 얽히며 반세기 넘는 분쟁으로 이어졌다.<\/p>\n<h3>결과<\/h3>\n<p>1555년 아우크스부르크 화의로 &quot;통치자가 지역의 종교를 정한다&quot;는 원칙이 성립하며 단일 교회 시대가 공식적으로 끝났다. 종교개혁은 이후 개신교 각 파의 형성, 가톨릭 내부의 자정 개혁(트리엔트 공의회), 그리고 길게는 30년 전쟁(1618-48)과 베스트팔렌 체제 — 근대 주권국가 질서 — 로 이어지는 연쇄의 출발점이 됐다.<\/p>\n<h3>핵심 인사이트<\/h3>\n<ol>\n<li><strong>개혁은 &#x27;새 주장&#x27;이 아니라 &#x27;새 유통&#x27;에서 폭발한다.<\/strong> 면벌부 비판은 루터 이전에도 있었다(위클리프, 후스). 달랐던 건 인쇄술이라는 배포 인프라였다. <em>활용: 콘텐츠 전략 — 메시지보다 미디어 적합성, 타이밍론.<\/em><\/li>\n<li><strong>로컬 언어로 말하는 자가 대중을 얻는다.<\/strong> 라틴어(전문가 언어)를 독일어(대중 언어)로 바꾼 순간 게임이 바뀌었다. <em>활용: 전문 지식의 대중화, 브랜딩의 언어 전략.<\/em><\/li>\n<li><strong>권위는 반박당할 때가 아니라 &#x27;우회당할 때&#x27; 무너진다.<\/strong> 루터는 교회를 이기려 하지 않고 성서 직접 읽기라는 우회로를 열었다. <em>활용: 시장 파괴자 전략 — 기존 게이트키퍼 우회 구조(스트리밍, 직거래, 크리에이터 이코노미).<\/em><\/li>\n<li><strong>개혁가는 자신이 연 문의 끝을 통제하지 못한다.<\/strong> 루터는 농민전쟁 등 자신의 이름으로 번진 급진화에 당황하며 선을 그었다. <em>활용: 운동의 확산과 변질, 창업자의 통제력 상실 문제.<\/em><\/li>\n<\/ol>\n<h3>반복의 라임<\/h3>\n<ul>\n<li><strong>↺ 인터넷·SNS와 기성 미디어 권위의 해체 (1990s~)<\/strong>: 배포 비용의 붕괴가 게이트키퍼를 우회시키는 동일 메커니즘. 차이: 확산 속도(주 단위 → 분 단위)와 검증 장치의 부재.<\/li>\n<li><strong>↺ 3·1 운동과 독립선언서 인쇄·배포(1919)<\/strong>: 금지된 메시지가 인쇄물로 전국 동시 확산된 구조적 유사. 차이: 종교 권위가 아닌 식민 권력이 대상.<\/li>\n<li><strong>↺ 크리에이터 이코노미의 탈중개화(2010s~)<\/strong>: &quot;성직자를 거치지 않는 신앙&quot;과 &quot;방송사를 거치지 않는 창작자&quot;의 구조 라임. 차이: 후자는 플랫폼이라는 새 게이트키퍼를 낳았다 — 개혁 이후 새 권위가 서는 패턴까지 닮았다.<\/li>\n<\/ul>\n<h3>강연·기획 활용 포인트<\/h3>\n<ul>\n<li>&quot;유튜브의 원형은 1517년에 있었다&quot;는 프레임 — 미디어 변화 강연의 검증된 오프닝.<\/li>\n<li>95개조가 &#x27;바이럴 콘텐츠&#x27;가 된 확산 타임라인은 마케팅 교육 자료로 변환 가능.<\/li>\n<li><strong>주의<\/strong>: 종교 자체의 교리적 우열 논쟁으로 들어가지 말 것. 이 카드는 미디어·권위·개혁의 메커니즘까지만 다룬다.<\/li>\n<\/ul>\n<h3>흔한 오독 주의<\/h3>\n<ul>\n<li><strong>마틴 루터 킹과의 혼동<\/strong> — 1517년의 인물은 마르틴 루터(독일 신학자), 킹 목사는 1929~68년 미국 민권운동가다. 강연에서 뒤바꾸면 신뢰도가 즉시 깎이는 지점.<\/li>\n<li>&quot;성당 문에 못 박는 루터&quot;의 극적 장면은 사실 여부가 논쟁 중이다 — 인용 시 &quot;전해지는 바로는&quot;을 붙이는 게 안전하다.<\/li>\n<li>루터를 근대적 관용의 화신으로 그리는 것도 부정확하다. 만년의 저작에는 현대 기준으로 옹호 불가능한 내용(유대인 배척 등)이 있으며, 인물 전체를 성인화하지 않는 균형이 필요하다.<\/li>\n<\/ul>\n<h3>연결 사건<\/h3>\n<p>구텐베르크 인쇄혁명(42), 3·1 운동(27), 마틴 루터 킹과 민권운동(36), 프랑스 혁명(13), 드레퓌스 사건(55 — 여론전의 진화).<\/p>"}, {"title": "스무트-홀리 관세법과 대공황", "ys": 1930, "ye": 1934, "period": "1930–1934", "region": "미주·세계", "track": "경제위기의 사이클", "color": "#B9955C", "tags": ["관세", "보호무역", "대공황", "무역전쟁", "보복관세"], "reliability": "사료기반", "one": "대공황 초입의 미국이 자국 산업을 지키려 2만여 품목의 관세를 대폭 인상했다가 각국의 보복관세 연쇄를 부르며 세계 무역을 3분의 1 수준으로 쪼그라뜨린, \"선의의 보호가 모두의 침몰이 된\" 보호무역의 대표 실패 사례.", "rhymes": 3, "html": "<h2>스무트-홀리 관세법과 대공황<\/h2>\n<p><strong>한 줄 정의:<\/strong> 대공황 초입의 미국이 자국 산업을 지키려 2만여 품목의 관세를 대폭 인상했다가 각국의 보복관세 연쇄를 부르며 세계 무역을 3분의 1 수준으로 쪼그라뜨린, &quot;선의의 보호가 모두의 침몰이 된&quot; 보호무역의 대표 실패 사례.<\/p>\n<h3>배경<\/h3>\n<p>1920년대 미국 농업은 유럽 농업의 전후 복구로 공급과잉·가격폭락에 시달렸고, 농민 표를 의식한 의회는 농산물 관세 인상을 추진했다. 논의 과정에서 각 지역구 의원들이 자기 지역 품목을 끼워 넣는 로그롤링(주고받기 입법)이 벌어지며 법안은 농업 보호를 넘어 공산품까지 2만여 품목의 전방위 관세 인상으로 비대해졌다. 1,028명의 경제학자가 거부권 행사를 청원하고 헨리 포드 등 기업인들도 반대했지만, 후버 대통령은 1930년 6월 법안에 서명했다.<\/p>\n<h3>전개<\/h3>\n<p>캐나다를 시작으로 유럽 주요국들이 즉각 보복관세로 응수했다. 관세 인상 → 상대국 보복 → 추가 위축의 악순환이 돌며 각국은 블록경제로 후퇴했다. 이미 1929년 주가 폭락으로 흔들리던 세계 경제에 무역 붕괴가 겹쳤다.<\/p>\n<h3>결과<\/h3>\n<p>1929~1934년 사이 세계 무역량은 대략 3분의 2가 증발했다⚠️(집계 방식에 따라 60~66% 감소로 서술이 갈린다). 스무트-홀리가 대공황의 &quot;원인&quot;인지 &quot;증폭기&quot;인지는 학계 논쟁이 있으나, 보복 연쇄를 촉발해 침체를 국제화·장기화시켰다는 데는 폭넓은 합의가 있다. 이 실패의 학습이 전후 GATT(1947)와 WTO로 이어지는 다자 무역질서의 출발점이 됐다.<\/p>\n<h3>핵심 인사이트<\/h3>\n<ol>\n<li><strong>부분의 합리성이 전체의 재앙이 된다.<\/strong> 의원 개개인의 지역구 챙기기는 각자에게 합리적이었지만 합쳐지자 괴물 법안이 됐다. <em>활용: 조직 내 부분최적화 vs 전체최적화, 사일로 문제 강연.<\/em><\/li>\n<li><strong>보복은 대칭이 아니라 증폭으로 돌아온다.<\/strong> 상대도 국내 정치가 있어 &quot;같은 크기&quot;가 아니라 &quot;더 세게&quot; 되받는다. <em>활용: 협상론, 치킨게임 구조, 가격전쟁 사례.<\/em><\/li>\n<li><strong>전문가 1,028명의 경고보다 표가 셌다.<\/strong> 지식과 정치의 속도 차이는 구조적이다. <em>활용: 데이터 기반 의사결정의 한계와 설득 설계.<\/em><\/li>\n<li><strong>실패는 제도로 학습됐다.<\/strong> 스무트-홀리의 폐허 위에서 다자주의(GATT)가 태어났다 — 위기가 룰을 만든다. <em>활용: 사후 제도화, 포스트모템 문화.<\/em><\/li>\n<\/ol>\n<h3>반복의 라임<\/h3>\n<ul>\n<li><strong>↺ 2018~2025 미중·글로벌 관세전쟁<\/strong>: 자국 산업 보호 명분, 상대국 보복, 공급망 블록화까지 메커니즘이 닮았다. 차이: 현대는 WTO·글로벌 가치사슬이라는 완충장치와 우회로가 존재하며, 관세가 협상 지렛대로도 쓰인다.<\/li>\n<li><strong>↺ 1970~80년대 미일 무역분쟁<\/strong>: 특정 산업(자동차·반도체) 보호와 수출자율규제. 차이: 전면 관세가 아닌 표적형 압박이었고 동맹 관계 안에서 관리됐다.<\/li>\n<li><strong>↺ 1930년대 블록경제 → 현대 프렌드쇼어링<\/strong>: 무역의 진영화라는 구조 반복. 차이: 당시는 침체의 결과, 지금은 안보 논리가 선행.<\/li>\n<\/ul>\n<h3>강연·기획 활용 포인트<\/h3>\n<ul>\n<li>&quot;관세전쟁은 트럼프가 발명한 게 아니다&quot;로 시작하는 오프닝은 역사 아카이브형 콘텐츠의 모범 훅.<\/li>\n<li>1,028명 경제학자 청원 문서는 &quot;전문가 경고가 무시된 순간&quot; 시각자료로 강력.<\/li>\n<li><strong>주의<\/strong>: 현재 진행형 관세 정책에 대한 찬반 판정으로 확장하지 말 것 — 이 카드는 메커니즘 비교까지만.<\/li>\n<\/ul>\n<h3>흔한 오독 주의<\/h3>\n<ul>\n<li>&quot;스무트-홀리가 대공황을 일으켰다&quot;는 과장이다. 공황은 이미 시작돼 있었고, 이 법은 방아쇠가 아니라 증폭기였다는 게 다수설.<\/li>\n<li>후버가 무지해서 서명한 것도 아니다 — 그는 유보적이었으나 당내 정치에 밀렸다⚠️(전기·연구별 뉘앙스 차이 있음).<\/li>\n<\/ul>\n<h3>연결 사건<\/h3>\n<p>1929 대공황(6), 미국 뉴딜(20), 브레턴우즈 체제(52), 반도체 미일 분쟁(46), 아편전쟁(48 — 무역과 무력의 다른 결말).<\/p>"}, {"title": "IMF 외환위기 (한국·아시아)", "ys": 1997, "ye": 2001, "period": "1997–2001", "region": "한국·동아시아", "track": "경제위기의 사이클", "color": "#B9955C", "tags": ["외환위기", "IMF", "구조조정", "전염효과", "금모으기"], "reliability": "통설", "one": "태국 바트화 붕괴에서 시작된 금융 전염이 넉 달 만에 한국의 외환보유고를 바닥내며 IMF 구제금융으로 이어진 사건 — 한 나라의 위기가 아니라 \"단기외채 + 고정환율 + 금융감독 부재\"라는 같은 구조를 가진 나라들이 도미노로 넘어진 시스템 위기.", "rhymes": 3, "html": "<h2>IMF 외환위기 (한국·아시아)<\/h2>\n<p><strong>한 줄 정의:<\/strong> 태국 바트화 붕괴에서 시작된 금융 전염이 넉 달 만에 한국의 외환보유고를 바닥내며 IMF 구제금융으로 이어진 사건 — 한 나라의 위기가 아니라 &quot;단기외채 + 고정환율 + 금융감독 부재&quot;라는 같은 구조를 가진 나라들이 도미노로 넘어진 시스템 위기.<\/p>\n<h3>배경<\/h3>\n<p>1990년대 한국 경제는 고도성장의 관성 속에 재벌의 차입 경영(부채비율 400%대⚠️)과 금융기관의 단기 외화차입이 누적돼 있었다. 종금사들이 단기로 빌린 달러를 장기로 굴리는 만기 불일치가 구조화됐고, 금융감독은 이를 따라가지 못했다. 1997년 초 한보·기아 등 대기업 연쇄 부도로 신인도가 흔들리던 차에, 7월 태국이 바트화 방어를 포기하며 아시아 전역에 자본 이탈이 시작됐다.<\/p>\n<h3>전개<\/h3>\n<p>투자자들은 태국과 비슷한 구조(단기외채·경상적자·취약한 금융)를 가진 나라를 차례로 공격했다 — 인도네시아, 말레이시아, 그리고 한국. 11월 한국의 가용 외환보유고가 사실상 고갈되며 정부는 IMF에 구제금융을 신청했고, 12월 3일 총 550억 달러 규모⚠️(IMF 210억 달러 포함, 집계 방식에 따라 570억 달러로도 서술)의 지원 패키지에 합의했다. 조건은 고금리·긴축, 부실 금융기관 정리, 재벌 구조조정, 정리해고제 도입, 자본시장 개방이었다.<\/p>\n<h3>결과<\/h3>\n<p>1998년 성장률 -5%대의 급락과 대량실업이 왔고, 30대 재벌의 절반 가까이가 해체·재편됐다. 한편 금모으기 운동(약 350만 명 참여⚠️)이라는 이례적 시민 동원이 있었고, 한국은 2001년 8월 차입금을 조기 상환하며 졸업했다. 이후 외환보유고 확충, 금융감독원 체제, 부채비율 규제가 제도화됐다.<\/p>\n<p><strong>해석이 갈리는 지점 (복수 관점 병기):<\/strong> IMF 처방에 대한 평가는 지금도 나뉜다. (가) 구조조정이 한국 경제의 체질을 바꿔 조기 회복을 가능케 했다는 관점과, (나) 고금리·긴축이 위기를 불필요하게 증폭시켰고(IMF 스스로 후일 일부 과잉을 인정) 비정규직 확대 등 장기 비용을 남겼다는 관점이 공존한다. 이 카드는 어느 한쪽을 정설로 취급하지 않는다.<\/p>\n<h3>핵심 인사이트<\/h3>\n<ol>\n<li><strong>위기는 국경이 아니라 &#x27;구조의 유사성&#x27;을 따라 전염된다.<\/strong> 태국과 한국은 멀지만 대차대조표는 닮아 있었다. <em>활용: 리스크 관리 — &quot;우리와 구조가 같은 곳이 무너지면 다음은 우리다&quot;.<\/em><\/li>\n<li><strong>만기 불일치는 평시엔 이익, 위기엔 즉사다.<\/strong> 단기로 빌려 장기로 굴리는 구조는 신뢰가 흔들리는 순간 붕괴한다. <em>활용: 재무 안정성, 현금흐름 경영 강연.<\/em><\/li>\n<li><strong>위기의 비용은 비대칭적으로 분배된다.<\/strong> 회복의 과실과 구조조정의 고통이 같은 사람에게 가지 않았다는 점이 이후 20년 한국 사회 논쟁의 뿌리가 됐다. <em>활용: 변화관리에서 고통 분담 설계의 중요성.<\/em><\/li>\n<li><strong>국가도 포스트모템으로 강해진다.<\/strong> 외환보유고 4천억 달러 시대와 금융감독 체계는 이 실패의 직접 유산이다. <em>활용: 실패 학습의 제도화.<\/em><\/li>\n<\/ol>\n<h3>반복의 라임<\/h3>\n<ul>\n<li><strong>↺ 1994 멕시코 테킬라 위기<\/strong>: 단기 달러부채 + 고정환율 붕괴 + 미국 주도 구제라는 동일 골격. 차이: 지역 전염의 범위.<\/li>\n<li><strong>↺ 2010~12 남유럽 재정위기(그리스)<\/strong>: 외부 앵커(유로/달러페그)에 묶인 채 유동성 위기가 지불능력 위기로 번진 구조, 구제금융 조건을 둘러싼 주권 논쟁까지 닮았다. 차이: 국가부채 중심 vs 민간부채 중심.<\/li>\n<li><strong>↺ 2022 영국 길트 발작·SVB 사태(2023)<\/strong>: 만기 불일치가 신뢰 붕괴로 즉사하는 메커니즘의 소형 반복. 차이: 중앙은행의 즉각 개입으로 전염 차단.<\/li>\n<\/ul>\n<h3>강연·기획 활용 포인트<\/h3>\n<ul>\n<li>&quot;태국의 7월이 한국의 11월이 되기까지 넉 달&quot; — 전염 타임라인은 리스크 강연의 강력한 내러티브 축.<\/li>\n<li>금모으기 운동은 위기 시 공동체 동원의 세계적 희귀 사례로, 조직 위기관리·팀십 강연에서 감정적 앵커로 유효.<\/li>\n<li><strong>주의<\/strong>: IMF 처방 평가는 위의 복수 관점을 반드시 병기할 것. 특정 정부·인물 책임론으로 단순화하지 말 것.<\/li>\n<\/ul>\n<h3>흔한 오독 주의<\/h3>\n<ul>\n<li>&quot;IMF가 위기를 일으켰다&quot;는 인과 전도다 — 위기의 원인은 누적된 구조였고 IMF는 사후 처방자였다. 처방의 적절성 논쟁과 원인 규명은 별개다.<\/li>\n<li>&quot;외환위기 = 국가부도&quot;도 부정확하다. 한국은 디폴트(채무불이행)를 선언한 적이 없다.<\/li>\n<\/ul>\n<h3>연결 사건<\/h3>\n<p>플라자 합의와 일본 버블(11), 2008 금융위기(10), 브레턴우즈 붕괴(52), 한강의 기적(29 — 압축성장의 빛과 이 사건의 그림자는 한 쌍).<\/p>"}];
const TRACKS=["경제위기의 사이클", "개혁과 반동"];
const COLORS={"경제위기의 사이클": "#B9955C", "개혁과 반동": "#C4472F", "전쟁과 기록": "#7D8CA3", "화해와 전환": "#8FA98F", "전염병과 사회 변동": "#A67C9D", "기술·항로·패권": "#5E8FA8", "제도와 문서의 힘": "#C9A227", "대중·정보·여론": "#B06A5A"};
let track="전체", q="";
const chips=document.getElementById("chips"), tl=document.getElementById("tl");
["전체",...TRACKS].forEach(t=>{const b=document.createElement("button");b.className="chip"+(t==="전체"?" on":"");
 b.innerHTML=(t==="전체"?"":`<span class="dot" style="background:${COLORS[t]||"#9AA3AF"}"></span>`)+t;
 b.onclick=()=>{track=t;document.querySelectorAll(".chip").forEach(x=>x.classList.toggle("on",x===b));draw()};
 chips.insertBefore(b,document.getElementById("q"))});
document.getElementById("q").addEventListener("input",e=>{q=e.target.value.trim().toLowerCase();draw()});
function match(e){const inT=track==="전체"||e.track===track;const hay=(e.title+e.region+e.track+(e.tags||[]).join(" ")).toLowerCase();return inT&&(!q||hay.includes(q))}
function eraLabel(y){if(y<1)return "기원전";return (Math.floor((y-1)/100)+1)+"세기"}
function draw(){
  const list=EVS.filter(match);
  document.getElementById("count").textContent=list.length+" / "+EVS.length+"건 · 연대순";
  tl.innerHTML="";
  if(!list.length){tl.innerHTML='<div class="empty">이 조건의 사건이 아직 없습니다. 필터를 바꾸거나 검색어를 지워보세요.</div>';return}
  let era=null;
  list.forEach(e=>{
    const el2=eraLabel(e.ys);
    if(el2!==era){era=el2;const d=document.createElement("div");d.className="era";d.textContent=era;tl.appendChild(d)}
    const b=document.createElement("button");b.className="ev";
    b.innerHTML=`<div class="yr">${e.period}</div><div class="node" style="border-color:${e.color}"></div>
      <div class="card" style="border-left-color:${e.color}">
        <div class="tk" style="color:${e.color}">${e.track}</div>
        <div class="tt">${e.title}</div>
        <div class="ol">${e.one}</div>
        <div class="meta"><span class="badge">${e.region}</span><span class="badge">${e.reliability}</span>${e.rhymes?`<span class="badge rh">↺ 라임 ${e.rhymes}</span>`:""}</div>
      </div>`;
    b.onclick=()=>open(e);
    tl.appendChild(b);
  });
}
function open(e){
  document.getElementById("dcat").textContent=e.track+" · "+e.period+" · "+e.region+" · "+e.reliability;
  document.getElementById("dtitle").textContent=e.title;
  document.getElementById("dwho").textContent=(e.tags||[]).map(t=>"#"+t).join("  ");
  document.getElementById("dbody").innerHTML=e.html;
  document.getElementById("dbody").scrollTop=0;
  dlg.showModal();
}
draw();
</script>
